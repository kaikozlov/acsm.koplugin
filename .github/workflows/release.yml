name: Release

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            clobber:
                description: "Replace the release asset if it already exists"
                required: false
                type: boolean
                default: false

permissions:
    contents: write

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    release:
        name: Build and publish release
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Check out repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Determine plugin version
              id: version
              run: |
                  set -euo pipefail
                  version="$(sed -n 's/.*version *= *"\([^"]*\)".*/\1/p' _meta.lua)"
                  if [ -z "$version" ]; then
                    echo "Could not extract version from _meta.lua" >&2
                    exit 1
                  fi
                  echo "version=$version" >> "$GITHUB_OUTPUT"
                  echo "zip=build/acsm-koplugin-${version}.zip" >> "$GITHUB_OUTPUT"
                  echo "asset=acsm-koplugin-${version}.zip" >> "$GITHUB_OUTPUT"
                  echo "Plugin version: $version"

            - name: Verify tag matches _meta.lua
              if: github.event_name == 'push'
              env:
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  set -euo pipefail
                  if [ "$GITHUB_REF_NAME" != "$VERSION" ]; then
                    echo "Tag '$GITHUB_REF_NAME' does not match _meta.lua version '$VERSION'" >&2
                    exit 1
                  fi

            - name: Check for existing release asset
              env:
                  GH_TOKEN: ${{ github.token }}
                  VERSION: ${{ steps.version.outputs.version }}
                  ASSET: ${{ steps.version.outputs.asset }}
                  CLOBBER: ${{ github.event_name == 'workflow_dispatch' && inputs.clobber }}
              run: |
                  set -euo pipefail

                  if ! gh release view "$VERSION" >/dev/null 2>&1; then
                    echo "Release $VERSION does not exist yet; continuing."
                    exit 0
                  fi

                  echo "Release $VERSION already exists."
                  if ! gh release view "$VERSION" --json assets -q '.assets[].name' | grep -Fxq "$ASSET"; then
                    echo "Asset $ASSET does not exist yet; continuing."
                    exit 0
                  fi

                  if [ "$CLOBBER" = "true" ]; then
                    echo "Asset $ASSET already exists; continuing because workflow_dispatch clobber=true."
                    exit 0
                  fi

                  echo "Asset $ASSET already exists on release $VERSION." >&2
                  echo "Failing before setup/tests/build to avoid accidental overwrite." >&2
                  echo "Re-run this workflow manually with clobber=true to replace it." >&2
                  exit 1

            - name: Install just
              uses: extractions/setup-just@v4
              with:
                  just-version: 1.57.0

            - name: Pull development image
              run: just pull-image

            - name: Verify
              run: just verify

            - name: Build release zip
              run: just build

            - name: Verify release artifact
              env:
                  ZIP: ${{ steps.version.outputs.zip }}
              run: |
                  set -euo pipefail
                  test -f "$ZIP"
                  unzip -tq "$ZIP"
                  entries="$(unzip -Z1 "$ZIP")"
                  grep -Fxq 'acsm.koplugin/_meta.lua' <<< "$entries"
                  grep -Fxq 'acsm.koplugin/patches/README.md' <<< "$entries"
                  grep -Fxq 'acsm.koplugin/patches/2-acsm-open-via-filemanager.lua' <<< "$entries"
                  if grep -Fq 'acsm.koplugin/spec/' <<< "$entries"; then
                    echo "Release artifact unexpectedly contains spec/" >&2
                    exit 1
                  fi
                  ls -lh "$ZIP"

            - name: Publish GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
                  VERSION: ${{ steps.version.outputs.version }}
                  ZIP: ${{ steps.version.outputs.zip }}
                  ASSET: ${{ steps.version.outputs.asset }}
                  CLOBBER: ${{ github.event_name == 'workflow_dispatch' && inputs.clobber }}
              run: |
                  set -euo pipefail

                  if gh release view "$VERSION" >/dev/null 2>&1; then
                    echo "Release $VERSION already exists"
                    if gh release view "$VERSION" --json assets -q '.assets[].name' | grep -Fxq "$ASSET"; then
                      if [ "$CLOBBER" = "true" ]; then
                        echo "Asset $ASSET already exists; replacing it because workflow_dispatch clobber=true"
                        gh release upload "$VERSION" "$ZIP" --clobber
                      else
                        echo "Asset $ASSET already exists on release $VERSION" >&2
                        echo "This should have been caught by the earlier fail-fast check." >&2
                        exit 1
                      fi
                    else
                      echo "Uploading new asset $ASSET to existing release $VERSION"
                      gh release upload "$VERSION" "$ZIP"
                    fi
                  else
                    echo "Creating release $VERSION"
                    notes_file="$(mktemp)"
                    gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
                      -f tag_name="$VERSION" \
                      -f target_commitish="$GITHUB_SHA" \
                      --jq .body > "$notes_file"
                    printf '\n' >> "$notes_file"
                    awk -v asset="$ASSET" '{ gsub(/\{\{ASSET\}\}/, asset); print }' \
                      .github/release-installation.md >> "$notes_file"
                    gh release create "$VERSION" "$ZIP" \
                      --title "$VERSION" \
                      --notes-file "$notes_file" \
                      --target "$GITHUB_SHA"
                  fi
