name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install just
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh \
            | bash -s -- --to "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/just" --version

      - name: Set up development image
        run: just setup

      - name: Determine plugin version
        id: version
        run: |
          set -euo pipefail
          version="$(sed -n 's/.*version *= *"\([^"]*\)".*/\1/p' _meta.lua)"
          if [ -z "$version" ]; then
            echo "Could not extract version from _meta.lua" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "zip=build/acsm.koplugin-${version}.zip" >> "$GITHUB_OUTPUT"
          echo "Plugin version: $version"

      - name: Verify tag matches _meta.lua
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" != "$VERSION" ]; then
            echo "Tag '$GITHUB_REF_NAME' does not match _meta.lua version '$VERSION'" >&2
            exit 1
          fi

      - name: Check Lua formatting
        run: just fmt-check

      - name: Run luacheck
        run: just lint

      - name: Run tests
        run: just test

      - name: Build release zip
        run: just build

      - name: Verify release artifact
        env:
          ZIP: ${{ steps.version.outputs.zip }}
        run: |
          set -euo pipefail
          test -f "$ZIP"
          unzip -l "$ZIP" | grep -q 'acsm.koplugin/_meta.lua'
          if unzip -l "$ZIP" | grep -q 'acsm.koplugin/spec/'; then
            echo "Release artifact unexpectedly contains spec/" >&2
            exit 1
          fi
          ls -lh "$ZIP"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          ZIP: ${{ steps.version.outputs.zip }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; uploading artifact with --clobber"
            gh release upload "$VERSION" "$ZIP" --clobber
          else
            echo "Creating release $VERSION"
            gh release create "$VERSION" "$ZIP" \
              --title "$VERSION" \
              --generate-notes \
              --target "$GITHUB_SHA"
          fi
